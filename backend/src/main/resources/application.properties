spring.application.name=localnow-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/localnow}
spring.datasource.username=${DB_USERNAME:localnow}
spring.datasource.password=${DB_PASSWORD:localnow}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:localnow}
security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
