services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-localnow}
      POSTGRES_USER: ${POSTGRES_USER:-localnow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localnow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - localnow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  localnow-postgres-data:
